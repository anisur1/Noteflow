name: Build NoteFlow APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.19.0'

      - name: Create Flutter App Shell
        run: |
          flutter create . --org com.soleeb.noteflow --project-name noteflow_pro

      - name: Inject Android Permissions
        run: |
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST_PATH" ]; then
            sed -i '/<application/i \
            <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>\n\
            <uses-permission android:name="android.permission.VIBRATE"/>\n\
            <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n\
            <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>\n\
            <uses-permission android:name="android.permission.USE_EXACT_ALARM"/>' "$MANIFEST_PATH"
          fi

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Release APK
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoteFlow-Pro-APK
          path: build/app/outputs/flutter-apk/app-release.apk
